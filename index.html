<!DOCTYPE html>
<html lang="en" class="scroll-smooth preload">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://i.postimg.cc/7hZVtdz9/Favicon-(without-BG)-(1).png" />
    <link rel="apple-touch-icon" href="https://i.postimg.cc/7hZVtdz9/Favicon-(without-BG)-(1).png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Classes</title>
    <!-- No transitions until the page has loaded: Tailwind's styles are generated in the browser,
         so for a moment elements carry default styles (e.g. light-grey borders); without this they
         visibly transition from those defaults to their real look. -->
    <style>.preload *, .preload *::before, .preload *::after { transition: none !important; }</style>
    <script>
      (function () {
        var done = false;
        function release() {
          if (done) return;
          done = true;
          document.documentElement.classList.remove('preload');
        }
        window.addEventListener('load', function () { setTimeout(release, 120); });
        // Failsafe: never hold transitions back for long (e.g. a slow image delaying "load").
        setTimeout(release, 2500);
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        /* hover: styles only on devices that can hover, so taps on phones never leave a stuck hover state */
        future: { hoverOnlyWhenSupported: true },
        theme: {
          extend: {
            colors: {
              /* STRICT BRAND ENFORCEMENT: Logo Green (#10B981) Only */
              'atlas-primary': '#10B981', /* Emerald 500 */
              'atlas-green': '#10B981',
              'atlas-orange': '#10B981', /* ALIASED TO GREEN - REMOVES ORANGE GLOBALLY */
              'orange': {
                 400: '#34D399', /* Emerald 400 */
                 500: '#10B981', /* Emerald 500 */
                 600: '#059669', /* Emerald 600 */
              },
              
              /* Dark Theme Palette */
              'atlas-dark': '#0B0F19', 
              'atlas-soft': '#111827', 
              'atlas-gray': '#1F2937', 
              'atlas-border': '#374151', 
              'atlas-text-main': '#F9FAFB', 
              'atlas-text-muted': '#9CA3AF',
              'atlas-black': '#05080F', 
              /* Surfaces, from page background up to raised panels */
              'atlas-surface': '#0F1520',
              'atlas-raised': '#141B28',
            },
            fontFamily: {
              /* Noto Sans Math only supplies glyphs Inter lacks (ℝ ∈ ∪ ≤ √ …) so maths symbols match */
              sans: ['Inter', 'Noto Sans Math', 'sans-serif'],
            },
            /* Design tokens shared by the public site (see pages/landing/ui.ts) */
            boxShadow: {
              'card': '0 20px 50px -24px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.04)',
              'card-raised': '0 28px 60px -24px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.06)',
              'glow-sm': '0 0 12px -2px rgba(16, 185, 129, 0.45)',
              'glow': '0 12px 30px -12px rgba(16, 185, 129, 0.6)',
              'glow-lg': '0 16px 40px -12px rgba(16, 185, 129, 0.75)',
            },
            transitionTimingFunction: {
              'premium': 'cubic-bezier(0.16, 1, 0.3, 1)',
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both',
              'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'scale-in': 'scaleIn 0.5s ease-out forwards',
              'welcome-reveal': 'welcomeReveal 1.8s cubic-bezier(0.16, 1, 0.3, 1) both',
              'welcome-sub': 'welcomeSub 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both',
              'welcome-line': 'welcomeLine 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both',
              'splash-out': 'splashOut 0.9s cubic-bezier(0.7, 0, 0.84, 0) forwards',
              'view-in': 'viewIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both',
              'shimmer': 'shimmer 1.6s linear infinite',
              'auth-in': 'authIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both',
              'shake': 'shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both',
              'menu-in': 'menuIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) both',
              'success-pop': 'successPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both',
              'draw-circle': 'drawStroke 0.6s cubic-bezier(0.65, 0, 0.35, 1) 0.15s both',
              'draw-check': 'drawStroke 0.35s cubic-bezier(0.65, 0, 0.35, 1) 0.65s both',
              'halo': 'halo 1.6s ease-out 0.7s both',
              /* Contact form "sent" sequence: plane takes off, then the tick draws in its place */
              'plane-fly': 'planeFly 1.1s cubic-bezier(0.65, 0, 0.35, 1) both',
              'plane-trail': 'planeTrail 1.1s cubic-bezier(0.65, 0, 0.35, 1) both',
              'draw-circle-late': 'drawStroke 0.6s cubic-bezier(0.65, 0, 0.35, 1) 0.95s both',
              'draw-check-late': 'drawStroke 0.35s cubic-bezier(0.65, 0, 0.35, 1) 1.45s both',
              'halo-late': 'halo 1.6s ease-out 1.5s both',
              'pop-late': 'successPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.9s both',
            },
            keyframes: {
              welcomeReveal: {
                '0%': { opacity: '0', letterSpacing: '0.4em', filter: 'blur(14px)', transform: 'translateY(24px) scale(0.96)' },
                '100%': { opacity: '1', letterSpacing: '-0.02em', filter: 'blur(0)', transform: 'translateY(0) scale(1)' },
              },
              welcomeSub: {
                '0%': { opacity: '0', transform: 'translateY(12px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              welcomeLine: {
                '0%': { transform: 'scaleX(0)', opacity: '0' },
                '100%': { transform: 'scaleX(1)', opacity: '1' },
              },
              splashOut: {
                '0%': { opacity: '1', transform: 'scale(1)', filter: 'blur(0)' },
                '100%': { opacity: '0', transform: 'scale(1.04)', filter: 'blur(6px)' },
              },
              viewIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'none' },
              },
              authIn: {
                '0%': { opacity: '0', transform: 'translateY(18px) scale(0.98)', filter: 'blur(6px)' },
                '100%': { opacity: '1', transform: 'none', filter: 'blur(0)' },
              },
              planeFly: {
                '0%': { opacity: '0', transform: 'translate(-10px, 14px) scale(0.6)' },
                '22%': { opacity: '1', transform: 'translate(0, 0) scale(1)' },
                '45%': { opacity: '1', transform: 'translate(-8px, 6px) scale(1) rotate(-4deg)' },
                '100%': { opacity: '0', transform: 'translate(130px, -100px) scale(0.5) rotate(-16deg)' },
              },
              planeTrail: {
                '0%, 40%': { opacity: '0', strokeDashoffset: '1' },
                '70%': { opacity: '0.8', strokeDashoffset: '0' },
                '100%': { opacity: '0', strokeDashoffset: '0' },
              },
              successPop: {
                '0%': { opacity: '0', transform: 'translateY(14px) scale(0.94)' },
                '100%': { opacity: '1', transform: 'none' },
              },
              // Paths set pathLength="1" and stroke-dasharray 1, so 1 → 0 draws the stroke.
              drawStroke: {
                '0%': { strokeDashoffset: '1' },
                '100%': { strokeDashoffset: '0' },
              },
              halo: {
                '0%': { opacity: '0.55', transform: 'scale(0.9)' },
                '100%': { opacity: '0', transform: 'scale(1.6)' },
              },
              scrollCue: {
                '0%': { opacity: '0', transform: 'translateY(0)' },
                '30%': { opacity: '1' },
                '100%': { opacity: '0', transform: 'translateY(12px)' },
              },
              menuIn: {
                '0%': { opacity: '0', transform: 'translateY(-6px) scale(0.97)' },
                '100%': { opacity: '1', transform: 'none' },
              },
              shake: {
                '0%, 100%': { transform: 'translateX(0)' },
                '20%, 60%': { transform: 'translateX(-6px)' },
                '40%, 80%': { transform: 'translateX(6px)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-400px 0' },
                '100%': { backgroundPosition: '400px 0' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(30px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.9)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              }
            },
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",

    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.5",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "axios": "https://aistudiocdn.com/axios@^1.13.2",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0"
  }
}
</script>
</head>
  <body class="bg-atlas-dark text-atlas-text-main antialiased selection:bg-atlas-primary selection:text-black">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
